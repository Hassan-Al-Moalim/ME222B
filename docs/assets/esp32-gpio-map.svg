<svg class="dia" viewBox="0 0 739 550" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="ESP32 GPIO capability map: which of GPIO 0 to 39 are general purpose, input only, strapping pins, wired to flash, or used by the USB serial port">
  <title>ESP32 GPIO capability map</title>
  <text class="p-head" x="26" y="32">ESP32 — what each GPIO can do</text>
  <text class="p-sub"  x="26" y="52">Pin numbering is the chip's, not the board silkscreen. Check your board before wiring.</text>
  <g class="p-strap">
    <rect class="p-cell" x="26" y="74" width="78" height="54" rx="6"/>
    <text class="p-num" x="65.0" y="100" text-anchor="middle">GPIO 0</text>
  </g>
  <g class="p-uart">
    <rect class="p-cell" x="113" y="74" width="78" height="54" rx="6"/>
    <text class="p-num" x="152.0" y="100" text-anchor="middle">GPIO 1</text>
  </g>
  <g class="p-strap">
    <rect class="p-cell" x="200" y="74" width="78" height="54" rx="6"/>
    <text class="p-num" x="239.0" y="100" text-anchor="middle">GPIO 2</text>
  </g>
  <g class="p-uart">
    <rect class="p-cell" x="287" y="74" width="78" height="54" rx="6"/>
    <text class="p-num" x="326.0" y="100" text-anchor="middle">GPIO 3</text>
  </g>
  <g class="p-ok">
    <rect class="p-cell" x="374" y="74" width="78" height="54" rx="6"/>
    <text class="p-num" x="413.0" y="100" text-anchor="middle">GPIO 4</text>
  </g>
  <g class="p-ok">
    <rect class="p-cell" x="461" y="74" width="78" height="54" rx="6"/>
    <text class="p-num" x="500.0" y="100" text-anchor="middle">GPIO 5</text>
  </g>
  <g class="p-flash">
    <rect class="p-cell" x="548" y="74" width="78" height="54" rx="6"/>
    <text class="p-num" x="587.0" y="100" text-anchor="middle">GPIO 6</text>
  </g>
  <g class="p-flash">
    <rect class="p-cell" x="635" y="74" width="78" height="54" rx="6"/>
    <text class="p-num" x="674.0" y="100" text-anchor="middle">GPIO 7</text>
  </g>
  <g class="p-flash">

  </g>
  <g class="p-ok">
    <rect class="p-cell" x="548" y="263" width="78" height="54" rx="6"/>
    <text class="p-num" x="587.0" y="289" text-anchor="middle">GPIO 30</text>
  </g>
  <g class="p-ok">
    <rect class="p-cell" x="635" y="263" width="78" height="54" rx="6"/>
    <text class="p-num" x="674.0" y="289" text-anchor="middle">GPIO 31</text>
  </g>
  <g class="p-ok">
    <rect class="p-cell" x="26" y="326" width="78" height="54" rx="6"/>
    <text class="p-num" x="65.0" y="352" text-anchor="middle">GPIO 32</text>
  </g>
  <g class="p-ok">
    <rect class="p-cell" x="113" y="326" width="78" height="54" rx="6"/>
    <text class="p-num" x="152.0" y="352" text-anchor="middle">GPIO 33</text>
  </g>

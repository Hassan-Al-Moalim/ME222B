    <text class="p-num" x="239.0" y="163" text-anchor="middle">GPIO 10</text>
  </g>
  <g class="p-flash">
    <rect class="p-cell" x="287" y="137" width="78" height="54" rx="6"/>
    <text class="p-num" x="326.0" y="163" text-anchor="middle">GPIO 11</text>
  </g>

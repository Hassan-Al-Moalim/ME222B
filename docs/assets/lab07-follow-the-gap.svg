.ftg .gap{fill:var(--md-typeset-a-color);fill-opacity:.3} .ftg .arr{stroke:var(--md-typeset-a-color);stroke-width:3;fill:none}
.ftg .ax{stroke:var(--md-default-fg-color--light);stroke-width:1} .ftg .rawl{fill:none;stroke:#c62828;stroke-width:1.5}
.ftg .widf{fill:var(--md-default-fg-color--lighter);fill-opacity:.5;stroke:var(--md-default-fg-color);stroke-width:1.5}
.ftg .openl{stroke:var(--md-typeset-a-color);stroke-width:1.5;stroke-dasharray:6 4}
.ftg .ah{fill:var(--md-typeset-a-color)}
</style>

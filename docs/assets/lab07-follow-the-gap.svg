<svg class="dia dia--wide ftg" viewBox="0 0 900 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Follow the Gap in three pictures and a plot. 1: the lidar sees two road walls and a box ahead on the right. 2: every obstacle is made wider by half the car width, so the car can be treated as a point. 3: the widest open gap left over is on the left of the box; the car steers to its middle, 27 degrees left. The plot shows distance against bearing before and after widening, the open line, the widest gap and the target.">
<title>Follow the Gap</title>

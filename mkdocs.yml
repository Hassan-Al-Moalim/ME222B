# ---------------------------------------------------------------------------
# ME 222B course site
# Local preview:  ./.venv/bin/mkdocs serve
# Build:          ./.venv/bin/mkdocs build
# ---------------------------------------------------------------------------

# Short, so the header carries just the course code in the corner.
# The full title is the heading on the home page.
site_name: ME 222B
site_description: Lab instructions, schedule, and reference material for ME 222B, Mechatronics and Intelligent Systems, KAUST Fall 2026/2027.
site_author: Amr Talaat Abdel Hamid

site_url: https://hassan-al-moalim.github.io/ME222B/
repo_url: https://github.com/Hassan-Al-Moalim/ME222B
repo_name: ME222B
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  font: false           # system font stack, like Just the Docs
  icon:
    repo: fontawesome/brands/github
  features:
    # One persistent left sidebar rather than top tabs, the way Just the Docs
    # course sites do it. Deliberately no navigation.sections or
    # navigation.expand: those pin every section open, which buries Reference
    # under ten lab entries. Sections collapse until clicked instead.
    - navigation.indexes        # section landing pages
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.action.edit
    - content.code.copy         # copy button on every code block
    - content.code.annotate
    - content.tabs.link         # OS tabs stay in sync across the page
  palette:
    # Light is the default. No `media:` keys, so the site does not follow the
    # OS setting — the toggle in the header is the only thing that changes it,
    # and Material remembers the choice for next visit.
    - scheme: default
      primary: white        # neutral header bar, not a colour band
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

hooks:
  - hooks/publish_markdown.py

plugins:
  - search
  - glightbox:                  # click any wiring photo to zoom
      touchNavigation: true
      loop: false
      effect: zoom
      draggable: true

markdown_extensions:
  - abbr
  - admonition                  # !!! warning "Safety"
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details            # collapsible ??? blocks
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true     # === "Windows" / === "macOS"
  - pymdownx.tasklist:
      custom_checkbox: true     # renders [ ] as real checkboxes
  - pymdownx.keys               # ++ctrl+c++
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.arithmatex:        # $...$ math for the control-theory labs
      generic: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/copypage.js
  - javascripts/schedule.js
  - javascripts/worksheet.js
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3.2.2/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/solid/envelope
      link: mailto:amr.abdelhamid@kaust.edu.sa
      name: Email the teaching team
  generator: false

nav:
  - Home: index.md
  - Syllabus: syllabus.md
  - Schedule: schedule.md
  - Labs:
      - labs/index.md
      - "Lab 1 - Motors and PWM": labs/lab01-pwm-motors.md
      - "Lab 2 - Encoders": labs/lab02-motor-characterization.md
      - "Lab 3 - Distance Sensing": labs/lab03-distance-sensing.md
      - "Lab 4 - IMU": labs/lab04-imu-calibration.md
      - "Lab 5 - Filtering": labs/lab05-logging-filtering.md
      - "Lab 6 - PID Control": labs/lab06-feedback-control.md
      - "Lab 7 - Localization": labs/lab07-straight-turns-localization.md
      - "Lab 8 - ThingsBoard": labs/lab08-servo-thingsboard.md
      - "Lab 9 - Multi-Car": labs/lab09-multi-car.md
      - "Lab 10 - Fleet Challenge": labs/lab10-fleet-challenge.md
  - Reference:
      - resources/index.md
      - "Setup - Arduino IDE": resources/setup.md
      - "Lab Safety": resources/safety.md
      - "Hardware and Pinout": resources/hardware.md
      - "Troubleshooting": resources/troubleshooting.md
